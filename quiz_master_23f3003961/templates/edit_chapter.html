<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Chapter</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        form { display: inline-block; text-align: left; }
        input, select, button { display: block; margin: 10px auto; padding: 8px; }
        button { cursor: pointer; }
    </style>
</head>
<body>
    <h1>Edit Chapter</h1>
    <form method="POST">
        <label for="chapter_name">Chapter Name:</label>
        <input type="text" id="chapter_name" name="chapter_name" value="{{ chapter.name }}" required>
        
        <label for="subject_id">Subject:</label>
        <select id="subject_id" name="subject_id" required>
        {% for subject in subjects %}
            <option value="{{ subject.id }}" {% if subject.id == chapter.subject_id %}selected{% endif %}>
        {{ subject.name }}
        </option>
        {% endfor %}
        </select>   
        <button type="submit">Update Chapter</button>
    </form>
    <br>
    <a href="{{ url_for('manage_chapters') }}">Back to Chapters</a>
</body>
</html>
