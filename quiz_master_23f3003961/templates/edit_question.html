<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Question</title>
</head>
<body>
    <h1>Edit Question</h1>
    <form method="POST">
        <label for="question_statement">Question Statement:</label><br>
        <input type="text" name="question_statement" value="{{ question.question_statement }}" required><br><br>

        <label for="option1">Option 1:</label><br>
        <input type="text" name="option1" value="{{ question.option1 }}" required><br><br>

        <label for="option2">Option 2:</label><br>
        <input type="text" name="option2" value="{{ question.option2 }}" required><br><br>

        <label for="option3">Option 3:</label><br>
        <input type="text" name="option3" value="{{ question.option3 }}" required><br><br>

        <label for="option4">Option 4:</label><br>
        <input type="text" name="option4" value="{{ question.option4 }}" required><br><br>

        <label for="correct_option">Correct Option (1-4):</label><br>
        <input type="number" name="correct_option" value="{{ question.correct_option }}" min="1" max="4" required><br><br>

        <button type="submit" class="edit-btn">Update Question</button>
    </form>
    <a href="{{ url_for('manage_questions') }}">Back to Question Management</a>
</body>
</html>
