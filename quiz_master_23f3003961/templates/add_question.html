<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Questions</title>
</head>
<body>
    <h2>Add a Question</h2>
    
    <form action="{{ url_for('add_question', quiz=quiz_id) }}" method="POST">
        <label>Question Statement:</label>
        <textarea name="question_text" required></textarea><br>

        <label>Option 1:</label>
        <input type="text" name="option1" required><br>

        <label>Option 2:</label>
        <input type="text" name="option2" required><br>

        <label>Option 3:</label>
        <input type="text" name="option3" required><br>

        <label>Option 4:</label>
        <input type="text" name="option4" required><br>

        <label>Correct Answer:</label>
        <select name="correct_option" required>
            <option value="option1">Option 1</option>
            <option value="option2">Option 2</option>
            <option value="option3">Option 3</option>
            <option value="option4">Option 4</option>
        </select><br>
        <button type="submit">Add Question</button>
    </form>
    <a href="{{ url_for('manage_questions', quiz=quiz_id) }}">Back to Questions</a>
</body>
</html>
