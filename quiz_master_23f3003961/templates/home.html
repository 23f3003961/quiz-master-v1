<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Quiz Master App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        h1 {
            color: #333;
        }
        .btn {
            display: inline-block;
            padding: 20px 20px;
            margin: 10px;
            text-decoration: none;
            color: white;
            background: #007BFF;
            border-radius: 5px;
        }
        .btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <strong><h1>Welcome to Quiz Master App</h1></strong>
        <p>Login/Register to start taking quizzes</p>
        <button onclick="window.location.href='{{ url_for('login') }}'">Login</button>
        <button onclick="window.location.href='{{ url_for('register') }}'">Register</button>
    </div>
</body>
</html>
